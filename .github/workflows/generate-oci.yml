name: generate-oci

on:
  workflow_call: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/general-intelligence-systems/nixhelm-generate:latest
    outputs:
      matrix: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix
        id: matrix
        run: |
          repos=$(yq -o=json 'keys' data/oci-repos.yaml | jq -c '.')
          echo "repos=$repos" >> $GITHUB_OUTPUT

  generate:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/general-intelligence-systems/nixhelm-generate:latest
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Generate charts
        run: bash bin/generate-repo "${{ matrix.repo }}" oci

      - uses: actions/upload-artifact@v4
        with:
          name: charts-${{ matrix.repo }}
          path: charts/${{ matrix.repo }}/
