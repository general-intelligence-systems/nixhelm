name: generate-oci

on:
  workflow_call: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix
        id: matrix
        run: |
          repos=$(python3 -c "
          import yaml, json
          with open('data/oci-repos.yaml') as f:
              data = yaml.safe_load(f)
          print(json.dumps(list(data.keys())))
          ")
          echo "repos=$repos" >> $GITHUB_OUTPUT

  generate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v2

      - name: Generate charts
        run: nix develop --command bash bin/generate-repo "${{ matrix.repo }}" oci

      - uses: actions/upload-artifact@v4
        with:
          name: charts-${{ matrix.repo }}
          path: charts/
