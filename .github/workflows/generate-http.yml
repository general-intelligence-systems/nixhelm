name: generate-http

on:
  workflow_call: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.repos }}
    steps:
      - uses: actions/checkout@v6

      - name: Build matrix
        id: matrix
        run: |
          repos=$(python3 -c "
          import yaml, json
          with open('data/http-repos.yaml') as f:
              data = yaml.safe_load(f)
          print(json.dumps(list(data.keys())))
          ")
          echo "repos=$repos" >> $GITHUB_OUTPUT

  generate:
    needs: setup
    runs-on: ubuntu-latest
    container: ghcr.io/general-intelligence-systems/nix-for-github-actions:latest
    strategy:
      matrix:
        repo: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Generate charts
        run: nix develop --command bash bin/generate-helm-repo "${{ matrix.repo }}"

      - name: Isolate repo charts for upload
        run: |
          mkdir -p _upload
          for dir in charts/stable/${{ matrix.repo }} charts/contrib/${{ matrix.repo }}; do
            if [ -d "$dir" ]; then
              mkdir -p "_upload/$(dirname "$dir")"
              cp -r "$dir" "_upload/$dir"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: charts-${{ matrix.repo }}
          path: _upload/charts/
          if-no-files-found: ignore
