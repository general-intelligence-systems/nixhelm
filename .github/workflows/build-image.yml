name: build-image

on:
  push:
    branches: [trench]
    paths:
      - image.nix
      - flake.nix
      - flake.lock
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build image
        run: nix build .#ci-image

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push image
        run: |
          docker load < result
          docker push ghcr.io/general-intelligence-systems/nixhelm-generate:latest
